name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            E621Client/bin/Release/*.nupkg
            E621Client.DbExport/bin/Release/*.nupkg
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    env:
      E621__Username: ${{ secrets.E621_USERNAME }}
      E621__ApiKey: ${{ secrets.E621_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Test solution
        run: dotnet test --configuration Release --no-restore
